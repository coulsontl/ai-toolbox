[package]
name = "aitoolbox"
version = "1.2.4"
edition = "2021"
description = "Lightweight command-line client for the AI Toolbox local Agent Control API"
license = "MIT"

[[bin]]
name = "aitoolbox"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
